name: Build macOS .dmg

# Đóng bộ cài Mac. **Phải chạy trên macOS** vì hdiutil chỉ có ở đó - và đây là
# cách duy nhất để làm việc đó từ một máy Windows: GitHub cho thuê một máy Mac
# thật, chạy đúng script mà người phát triển vẫn chạy ở nhà.
#
# Thứ tự phát hành một bản:
#
#   1. ./tools/publish-images.sh <version>          đẩy image lên ghcr
#   2. installer\release.ps1 -Version <version>     tạo release + .exe + latest.json
#   3. chạy workflow này                            đính thêm .dmg vào release đó
#
# Bước 3 sau bước 2 là bắt buộc: nó *đính thêm* file vào một release đã có,
# không tự tạo release. Chạy trước thì không có gì để đính vào.
#
# Đây là repo private, nên số phút chạy macOS bị tính **gấp 10 lần** so với
# runner Linux. Một lượt chạy khoảng 2 phút, tức khoảng 20 phút bị trừ.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, ví dụ 2026-10-12.2 (phải trùng tag release đã có)'
        required: true
        type: string

jobs:
  dmg:
    runs-on: macos-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Đóng gói .dmg
        run: |
          chmod +x tools/build-dmg.sh
          ./tools/build-dmg.sh "${{ inputs.version }}"

      - name: Kiểm tra .dmg mở được
        # Không phải thủ tục cho có. `hdiutil create` thành công không có nghĩa
        # là cái .dmg gắn vào được - và một file hỏng chỉ lộ ra ở máy khách,
        # dưới dạng "image not recognized" mà không nói gì thêm.
        run: |
          DMG="dist/AutoReel-${{ inputs.version }}.dmg"
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk '{$1=""; print substr($0,2)}')
          echo "Đã gắn vào: $MOUNT"
          ls -la "$MOUNT/AutoReel" | head -20

          # Ba file bắt buộc, và bit chạy của chúng - thứ dễ mất nhất khi đóng gói.
          for f in "Cài đặt.command" "Mở AutoReel.command" install.sh start.sh docker-compose.yml; do
            if [ ! -f "$MOUNT/AutoReel/$f" ]; then
              echo "::error::Thiếu $f trong .dmg"
              hdiutil detach "$MOUNT" -force || true
              exit 1
            fi
          done
          for f in "Cài đặt.command" install.sh start.sh; do
            if [ ! -x "$MOUNT/AutoReel/$f" ]; then
              echo "::error::$f mất quyền chạy - khách nhấp đôi sẽ báo lỗi"
              hdiutil detach "$MOUNT" -force || true
              exit 1
            fi
          done

          # Xuống dòng. Một script bash có CRLF chết ngay ở dòng shebang với
          # "bad interpreter: /bin/bash^M", trước khi in được gì - khách chỉ
          # thấy cửa sổ Terminal loé lên rồi tắt, không manh mối nào. Kiểm ở
          # đây vì đây là chỗ duy nhất bắt được nó trước khi tới tay khách.
          for f in "Cài đặt.command" "Mở AutoReel.command" "Mở Chrome Shopee.command" install.sh start.sh; do
            if grep -qU $'\r' "$MOUNT/AutoReel/$f"; then
              echo "::error::$f có ký tự CR - script sẽ chết ở dòng shebang trên macOS"
              hdiutil detach "$MOUNT" -force || true
              exit 1
            fi
          done
          echo "OK - không file nào có ký tự CR."

          if [ -e "$MOUNT/AutoReel/.env" ] || [ -d "$MOUNT/AutoReel/data" ]; then
            echo "::error::.env hoặc data/ lọt vào .dmg"
            hdiutil detach "$MOUNT" -force || true
            exit 1
          fi

          hdiutil detach "$MOUNT" -force
          echo "OK - .dmg gắn được, đủ file, quyền chạy đúng, không lẫn dữ liệu."

      - name: Lưu .dmg
        uses: actions/upload-artifact@v4
        with:
          name: AutoReel-dmg-${{ inputs.version }}
          path: dist/AutoReel-${{ inputs.version }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Đính vào release (nếu có token)
        # Bỏ qua khi chưa cấu hình RELEASES_TOKEN. Cần token vì release nằm ở
        # repo khác (linhdev/autoreel-releases, repo công khai giữ bản phát
        # hành), còn GITHUB_TOKEN mặc định chỉ có quyền trên chính repo này.
        #
        # Tạo token: GitHub → Settings → Developer settings → Fine-grained
        # tokens → quyền Contents: Read and write trên linhdev/autoreel-releases.
        # Rồi lưu vào repo này với tên RELEASES_TOKEN.
        #
        # Chưa có token cũng không sao: .dmg vẫn nằm trong phần Artifacts của
        # lượt chạy này, tải về tay rồi đính lên release bằng lệnh in ra ở bước
        # đóng gói.
        if: env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload "${{ inputs.version }}" \
            "dist/AutoReel-${{ inputs.version }}.dmg" \
            --repo linhdev/autoreel-releases \
            --clobber
          echo "Đã đính .dmg vào release ${{ inputs.version }}"
